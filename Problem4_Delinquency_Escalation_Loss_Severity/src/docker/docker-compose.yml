services:
  amex-severity-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-severity-api:latest
    container_name: amex-severity-api
    ports:
      - "8004:8004"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
