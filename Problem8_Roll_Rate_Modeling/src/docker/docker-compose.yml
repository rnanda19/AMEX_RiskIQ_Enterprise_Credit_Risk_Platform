services:
  amex-rr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-rr-api:latest
    container_name: amex-rr-api
    ports:
      - "8005:8005"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
