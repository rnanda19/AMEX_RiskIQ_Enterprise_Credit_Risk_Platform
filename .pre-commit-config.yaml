# Local pre-commit hooks -- mirrors the two fastest, cheapest checks already
# run in CI (.github/workflows/ci.yml's notebook-syntax job and
# code-quality.yml's lint job), so a broken notebook or an unused import is
# caught before it's even pushed, not just discovered in CI after the fact.
#
# Setup (one-time per clone):
#   pip install pre-commit pyflakes
#   pre-commit install
#
# Deliberately NOT included here: pytest (too slow for a pre-commit hook --
# stays a CI-only, push-time gate) and black/bandit (also CI-only for now;
# `black --check` and `bandit` are still worth running locally before a push,
# see CONTRIBUTING.md, but this repo's std convention is a fast pre-commit
# and a thorough pre-push/CI, not everything in one hook).
repos:
  - repo: local
    hooks:
      - id: check-notebook-syntax
        name: Notebook syntax check (ast.parse every code cell)
        entry: python scripts/check_notebook_syntax.py .
        language: system
        pass_filenames: false
        always_run: true

      - id: pyflakes
        name: pyflakes (unused imports, undefined names)
        entry: pyflakes
        language: system
        types: [python]
        args:
          - shared/
          - scripts/
          - 01_Problem1_Credit_Scoring_PD_Prediction/src
          - 01_Problem1_Credit_Scoring_PD_Prediction/tests
          - 02_Problem2_Risk_Tier_Classification/src
          - 02_Problem2_Risk_Tier_Classification/tests
          - 03_Problem3_Expected_Credit_Loss_IFRS9_CECL/src
          - 03_Problem3_Expected_Credit_Loss_IFRS9_CECL/tests
          - 04_Problem4_Delinquency_Escalation_Loss_Severity/src
          - 04_Problem4_Delinquency_Escalation_Loss_Severity/tests
          - 05_Problem5_Early_Payment_Default_Detection/src
          - 05_Problem5_Early_Payment_Default_Detection/tests
          - 06_Problem6_Dynamic_Behavioral_Credit_Scoring/src
          - 06_Problem6_Dynamic_Behavioral_Credit_Scoring/tests
          - 07_Problem7_Early_Warning_System/src
          - 07_Problem7_Early_Warning_System/tests
          - 08_Problem8_Roll_Rate_Modeling/src
          - 08_Problem8_Roll_Rate_Modeling/tests
          - 09_Problem9_Collections_Optimization/src
          - 09_Problem9_Collections_Optimization/tests
          - 10_Problem10_Credit_Line_Management/src
          - 10_Problem10_Credit_Line_Management/tests
          - 11_Problem11_Real_Time_Portfolio_Monitoring/src
          - 11_Problem11_Real_Time_Portfolio_Monitoring/tests
          - 12_Problem12_360_Customer_Intelligence/src
          - 12_Problem12_360_Customer_Intelligence/tests
          - 13_Problem13_Risk_Adjusted_Profitability_Modeling/src
          - 13_Problem13_Risk_Adjusted_Profitability_Modeling/tests
          - 14_Problem14_Executive_Decision_Support_Dashboard/src
          - 14_Problem14_Executive_Decision_Support_Dashboard/tests
        pass_filenames: false
        always_run: true
