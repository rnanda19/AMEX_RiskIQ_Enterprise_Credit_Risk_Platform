services:
  amex-p14-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-p14-api:latest
    container_name: amex-p14-api
    ports:
      - "8014:8014"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
