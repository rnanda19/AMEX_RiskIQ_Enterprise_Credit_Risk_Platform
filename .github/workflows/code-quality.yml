name: Code Quality

# Linting, formatting, and security scanning -- split out from ci.yml (tests + notebook syntax)
# so a quality-only failure doesn't read as "the models are broken", and vice versa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (pyflakes -- unused imports, undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - run: pyflakes shared/ scripts/
          01_Problem1_Credit_Scoring_PD_Prediction/src 01_Problem1_Credit_Scoring_PD_Prediction/tests
          02_Problem2_Risk_Tier_Classification/src 02_Problem2_Risk_Tier_Classification/tests
          03_Problem3_Expected_Credit_Loss_IFRS9_CECL/src 03_Problem3_Expected_Credit_Loss_IFRS9_CECL/tests
          04_Problem4_Delinquency_Escalation_Loss_Severity/src 04_Problem4_Delinquency_Escalation_Loss_Severity/tests
          05_Problem5_Early_Payment_Default_Detection/src 05_Problem5_Early_Payment_Default_Detection/tests
          06_Problem6_Dynamic_Behavioral_Credit_Scoring/src 06_Problem6_Dynamic_Behavioral_Credit_Scoring/tests
          07_Problem7_Early_Warning_System/src 07_Problem7_Early_Warning_System/tests
          08_Problem8_Roll_Rate_Modeling/src 08_Problem8_Roll_Rate_Modeling/tests
          09_Problem9_Collections_Optimization/src 09_Problem9_Collections_Optimization/tests
          10_Problem10_Credit_Line_Management/src 10_Problem10_Credit_Line_Management/tests
          11_Problem11_Real_Time_Portfolio_Monitoring/src 11_Problem11_Real_Time_Portfolio_Monitoring/tests
          12_Problem12_360_Customer_Intelligence/src 12_Problem12_360_Customer_Intelligence/tests
          13_Problem13_Risk_Adjusted_Profitability_Modeling/src 13_Problem13_Risk_Adjusted_Profitability_Modeling/tests
          14_Problem14_Executive_Decision_Support_Dashboard/src 14_Problem14_Executive_Decision_Support_Dashboard/tests
        continue-on-error: true  # advisory for now -- see ROADMAP.md "make lint blocking";
          # known pre-existing findings logged in docs/known_lint_findings.md

  format-check:
    name: Format check (black --check, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black
      - run: black --check --line-length 120 shared/
          01_Problem1_Credit_Scoring_PD_Prediction/src 02_Problem2_Risk_Tier_Classification/src
          03_Problem3_Expected_Credit_Loss_IFRS9_CECL/src 04_Problem4_Delinquency_Escalation_Loss_Severity/src
          05_Problem5_Early_Payment_Default_Detection/src 06_Problem6_Dynamic_Behavioral_Credit_Scoring/src
          07_Problem7_Early_Warning_System/src 08_Problem8_Roll_Rate_Modeling/src
          09_Problem9_Collections_Optimization/src 10_Problem10_Credit_Line_Management/src
          11_Problem11_Real_Time_Portfolio_Monitoring/src 12_Problem12_360_Customer_Intelligence/src
          13_Problem13_Risk_Adjusted_Profitability_Modeling/src 14_Problem14_Executive_Decision_Support_Dashboard/src
        continue-on-error: true  # advisory: repo-wide reformatting is a deliberate future pass
          # (see ROADMAP.md), not something to apply as a side effect of adding this check

  security-scan:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # Scans deployable src/ only, not tests/ -- pytest's own use of `assert` is standard
      # practice and not a real finding (bandit's B101 flags all asserts indiscriminately).
      # This check IS blocking: 0 real findings across every problem's src/ as of this pass.
      - run: bandit -r shared/config.py shared/metrics.py shared/monitoring.py shared/tiers.py
          01_Problem1_Credit_Scoring_PD_Prediction/src 02_Problem2_Risk_Tier_Classification/src
          03_Problem3_Expected_Credit_Loss_IFRS9_CECL/src 04_Problem4_Delinquency_Escalation_Loss_Severity/src
          05_Problem5_Early_Payment_Default_Detection/src 06_Problem6_Dynamic_Behavioral_Credit_Scoring/src
          07_Problem7_Early_Warning_System/src 08_Problem8_Roll_Rate_Modeling/src
          09_Problem9_Collections_Optimization/src 10_Problem10_Credit_Line_Management/src
          11_Problem11_Real_Time_Portfolio_Monitoring/src 12_Problem12_360_Customer_Intelligence/src
          13_Problem13_Risk_Adjusted_Profitability_Modeling/src 14_Problem14_Executive_Decision_Support_Dashboard/src -q
