name: Code Quality

# Linting, formatting, and security scanning -- split out from ci.yml (tests + notebook syntax)
# so a quality-only failure doesn't read as "the models are broken", and vice versa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (pyflakes -- unused imports, undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - run: pyflakes shared/ scripts/
          Problem1_Credit_Scoring_PD_Prediction/src Problem1_Credit_Scoring_PD_Prediction/tests
          Problem2_Risk_Tier_Classification/src Problem2_Risk_Tier_Classification/tests
          Problem3_Expected_Credit_Loss_IFRS9_CECL/src Problem3_Expected_Credit_Loss_IFRS9_CECL/tests
          Problem4_Delinquency_Escalation_Loss_Severity/src Problem4_Delinquency_Escalation_Loss_Severity/tests
          Problem5_Early_Payment_Default_Detection/src Problem5_Early_Payment_Default_Detection/tests
          Problem6_Dynamic_Behavioral_Credit_Scoring/src Problem6_Dynamic_Behavioral_Credit_Scoring/tests
          Problem7_Early_Warning_System/src Problem7_Early_Warning_System/tests
          Problem8_Roll_Rate_Modeling/src Problem8_Roll_Rate_Modeling/tests
          Problem9_Collections_Optimization/src Problem9_Collections_Optimization/tests
          Problem10_Credit_Line_Management/src Problem10_Credit_Line_Management/tests
          Problem11_Real_Time_Portfolio_Monitoring/src Problem11_Real_Time_Portfolio_Monitoring/tests
          Problem12_360_Customer_Intelligence/src Problem12_360_Customer_Intelligence/tests
          Problem13_Risk_Adjusted_Profitability_Modeling/src Problem13_Risk_Adjusted_Profitability_Modeling/tests
          Problem14_Executive_Decision_Support_Dashboard/src Problem14_Executive_Decision_Support_Dashboard/tests
        continue-on-error: true  # advisory for now -- see ROADMAP.md "make lint blocking";
          # known pre-existing findings logged in docs/known_lint_findings.md

  format-check:
    name: Format check (black --check, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black
      - run: black --check --line-length 120 shared/
          Problem1_Credit_Scoring_PD_Prediction/src Problem2_Risk_Tier_Classification/src
          Problem3_Expected_Credit_Loss_IFRS9_CECL/src Problem4_Delinquency_Escalation_Loss_Severity/src
          Problem5_Early_Payment_Default_Detection/src Problem6_Dynamic_Behavioral_Credit_Scoring/src
          Problem7_Early_Warning_System/src Problem8_Roll_Rate_Modeling/src
          Problem9_Collections_Optimization/src Problem10_Credit_Line_Management/src
          Problem11_Real_Time_Portfolio_Monitoring/src Problem12_360_Customer_Intelligence/src
          Problem13_Risk_Adjusted_Profitability_Modeling/src Problem14_Executive_Decision_Support_Dashboard/src
        continue-on-error: true  # advisory: repo-wide reformatting is a deliberate future pass
          # (see ROADMAP.md), not something to apply as a side effect of adding this check

  security-scan:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # Scans deployable src/ only, not tests/ -- pytest's own use of `assert` is standard
      # practice and not a real finding (bandit's B101 flags all asserts indiscriminately).
      # This check IS blocking: 0 real findings across every problem's src/ as of this pass.
      - run: bandit -r shared/config.py shared/metrics.py shared/monitoring.py shared/tiers.py
          Problem1_Credit_Scoring_PD_Prediction/src Problem2_Risk_Tier_Classification/src
          Problem3_Expected_Credit_Loss_IFRS9_CECL/src Problem4_Delinquency_Escalation_Loss_Severity/src
          Problem5_Early_Payment_Default_Detection/src Problem6_Dynamic_Behavioral_Credit_Scoring/src
          Problem7_Early_Warning_System/src Problem8_Roll_Rate_Modeling/src
          Problem9_Collections_Optimization/src Problem10_Credit_Line_Management/src
          Problem11_Real_Time_Portfolio_Monitoring/src Problem12_360_Customer_Intelligence/src
          Problem13_Risk_Adjusted_Profitability_Modeling/src Problem14_Executive_Decision_Support_Dashboard/src -q
