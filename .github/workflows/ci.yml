name: CI

# Runs on every push/PR touching main. Two checks (notebook syntax + tests), both fast
# (seconds, not minutes) because neither touches the real Kaggle dataset or the real multi-GB
# per-customer parquet files -- see shared/tests/ and each Problem's tests/ for how
# synthetic-but-structurally-real fixtures (Problems 12-13's per-customer lookup tables) or the
# real small deployable artifacts shipped in-repo (trained models/frozen policy JSON, Problems
# 3-9, 11, 14) make that possible.
# Lint/format/security checks live in a separate workflow -- see code-quality.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notebook-syntax-check:
    name: Notebook syntax check (ast.parse every code cell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_notebook_syntax.py .

  unit-tests:
    name: Unit tests (shared/ + each Problem's tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest shared/tests -v
      - name: Problem 1 tests
        run: python -m pytest Problem1_Credit_Scoring_PD_Prediction/tests -v
        if: hashFiles('Problem1_Credit_Scoring_PD_Prediction/tests/**') != ''
      - name: Problem 2 tests
        run: python -m pytest Problem2_Risk_Tier_Classification/tests -v
        if: hashFiles('Problem2_Risk_Tier_Classification/tests/**') != ''
      - name: Problem 3 tests
        run: python -m pytest Problem3_Expected_Credit_Loss_IFRS9_CECL/tests -v
        if: hashFiles('Problem3_Expected_Credit_Loss_IFRS9_CECL/tests/**') != ''
      - name: Problem 4 tests
        run: python -m pytest Problem4_Delinquency_Escalation_Loss_Severity/tests -v
        if: hashFiles('Problem4_Delinquency_Escalation_Loss_Severity/tests/**') != ''
      - name: Problem 5 tests
        run: python -m pytest Problem5_Early_Payment_Default_Detection/tests -v
        if: hashFiles('Problem5_Early_Payment_Default_Detection/tests/**') != ''
      - name: Problem 6 tests
        run: python -m pytest Problem6_Dynamic_Behavioral_Credit_Scoring/tests -v
        if: hashFiles('Problem6_Dynamic_Behavioral_Credit_Scoring/tests/**') != ''
      - name: Problem 7 tests
        run: python -m pytest Problem7_Early_Warning_System/tests -v
        if: hashFiles('Problem7_Early_Warning_System/tests/**') != ''
      - name: Problem 8 tests
        run: python -m pytest Problem8_Roll_Rate_Modeling/tests -v
        if: hashFiles('Problem8_Roll_Rate_Modeling/tests/**') != ''
      - name: Problem 9 tests
        run: python -m pytest Problem9_Collections_Optimization/tests -v
        if: hashFiles('Problem9_Collections_Optimization/tests/**') != ''
      - name: Problem 10 tests
        run: python -m pytest Problem10_Credit_Line_Management/tests -v
        if: hashFiles('Problem10_Credit_Line_Management/tests/**') != ''
      - name: Problem 11 tests
        run: python -m pytest Problem11_Real_Time_Portfolio_Monitoring/tests -v
        if: hashFiles('Problem11_Real_Time_Portfolio_Monitoring/tests/**') != ''
      - name: Problem 12 tests
        run: python -m pytest Problem12_360_Customer_Intelligence/tests -v
        if: hashFiles('Problem12_360_Customer_Intelligence/tests/**') != ''
      - name: Problem 13 tests
        run: python -m pytest Problem13_Risk_Adjusted_Profitability_Modeling/tests -v
        if: hashFiles('Problem13_Risk_Adjusted_Profitability_Modeling/tests/**') != ''
      - name: Problem 14 tests
        run: python -m pytest Problem14_Executive_Decision_Support_Dashboard/tests -v
        if: hashFiles('Problem14_Executive_Decision_Support_Dashboard/tests/**') != ''
