services:
  amex-p9-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-p9-api:latest
    container_name: amex-p9-api
    ports:
      - "8009:8009"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
