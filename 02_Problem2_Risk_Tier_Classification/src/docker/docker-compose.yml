services:
  amex-risk-tier-api:
    build: .
    image: amex-risk-tier-api:latest
    container_name: amex-risk-tier-api
    ports:
      - "8001:8001"
    volumes:
      - ${AMEX_PROJECT_ROOT_HOST}:/mnt/amex-project:ro
    environment:
      - AMEX_PROJECT_ROOT=/mnt/amex-project
      # Required -- never baked into the image. Set it in your shell or a .env file
      # next to this docker-compose.yml before running.
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
