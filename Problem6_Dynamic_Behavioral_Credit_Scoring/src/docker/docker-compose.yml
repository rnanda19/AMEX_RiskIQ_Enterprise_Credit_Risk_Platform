services:
  amex-dbs-api:
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    image: amex-dbs-api:latest
    container_name: amex-dbs-api
    ports:
      - "8006:8006"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
