services:
  amex-ecl-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-ecl-api:latest
    container_name: amex-ecl-api
    ports:
      - "8003:8003"
    environment:
      # Required -- never baked into the image. Set it in your shell or a .env file
      # next to this docker-compose.yml before running.
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
