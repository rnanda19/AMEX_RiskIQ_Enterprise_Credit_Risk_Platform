services:
  amex-ews-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-ews-api:latest
    container_name: amex-ews-api
    ports:
      - "8007:8007"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
