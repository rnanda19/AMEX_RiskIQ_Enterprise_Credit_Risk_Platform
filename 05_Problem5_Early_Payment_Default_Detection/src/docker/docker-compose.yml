services:
  amex-epd-api:
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile
    image: amex-epd-api:latest
    container_name: amex-epd-api
    ports:
      - "8002:8002"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
