[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amex-riskiq-shared"
version = "0.1.0"
description = "Shared library (metrics, config, monitoring, tier assignment) for the AMEX RiskIQ Enterprise Credit Risk Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nandagopal" }]

# NOTE: this package is NOT published to PyPI and is not licensed for external reuse or
# redistribution (see LICENSE -- All Rights Reserved). This file exists so `shared/` is
# pip-installable in editable mode for local development and CI (`pip install -e .`), and to
# demonstrate real packaging practice, not to invite external installation.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "xgboost>=2.0",
    "scipy>=1.12",
]

[tool.setuptools]
packages = ["shared"]

[tool.pytest.ini_options]
testpaths = ["shared/tests"]

[tool.black]
line-length = 120
target-version = ["py311"]
