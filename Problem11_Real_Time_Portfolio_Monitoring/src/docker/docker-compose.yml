services:
  amex-p11-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-p11-api:latest
    container_name: amex-p11-api
    ports:
      - "8011:8011"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
    restart: unless-stopped
