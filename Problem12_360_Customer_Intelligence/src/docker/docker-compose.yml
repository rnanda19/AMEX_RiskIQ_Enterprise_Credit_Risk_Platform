services:
  amex-p12-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: amex-p12-api:latest
    container_name: amex-p12-api
    ports:
      - "8012:8012"
    environment:
      - API_KEY=${API_KEY:?Set API_KEY before running -- see src/.env.example}
      - AMEX_P12_PROFILE_PATH=/app/data/unified_customer_profile.parquet
    volumes:
      - ../data:/app/data:ro
    restart: unless-stopped
